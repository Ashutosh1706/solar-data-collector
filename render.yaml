databases:
  - name: solar-db
    plan: free

services:
  - type: web
    name: nmtronics-ashutosh
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: DATABASE_URL
        fromDatabase:
          name: solar-db
          property: connectionString
